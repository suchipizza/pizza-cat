name: Check engine

on:
  push:
    paths-ignore:
      - 'dist/**'
      - '**.md'
      - 'LICENSE'
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify checked-in output
        # Pushes may have changed config without committing dist; generation will handle that.
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- dist/
