name: Generate profile scene

on:
  workflow_dispatch:
  push:
    paths:
      - 'profile.config.ts'
      - 'characters/**'
      - 'props/**'
      - 'src/**'
      - 'scripts/generate.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/generate.yml'

permissions:
  contents: read

concurrency:
  group: generate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    # Only the default branch writes artifacts; feature branches are verified by CI.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Commit generated scenes if changed
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git add dist/
          if git diff --cached --quiet; then
            echo "The scene is already up to date. The snacks remain airborne."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: regenerate profile scene"
          git push origin "HEAD:$BRANCH"

# dist-only commits do not match the push paths above. No infinite pizza loop in CI.
